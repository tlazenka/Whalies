name: whalekart

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: whaley
      POSTGRES_USER: whaley
      POSTGRES_PASSWORD: whaley
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whaley -d whaley"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - whaley-db-data:/var/lib/postgresql

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    working_dir: /workspace/Scala
    command: ["sbt", "server/run"]
    environment:
      WHALEY_JDBC_URL: jdbc:postgresql://db:5432/whaley
      WHALEY_DB_HOST: db
      WHALEY_DB_PORT: "5432"
      WHALEY_DB_NAME: whaley
      WHALEY_DB_USER: whaley
      WHALEY_DB_PASSWORD: whaley
      PLAY_HTTP_SECRET_KEY: ${PLAY_HTTP_SECRET_KEY:-dev-only-replace-before-deployment}
    ports: ["9000:9000"]
    volumes:
      - ./Scala:/workspace/Scala
      - ./python:/workspace/python:ro
      - scala-sbt-cache:/root/.sbt
      - scala-coursier-cache:/root/.cache/coursier
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  # Live observation stays read-only, not cooperative gameplay.
  whaley-relay:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: ["swift", "run", "--skip-build", "whaley-relay"]
    environment:
      WHALEY_RELAY_PORT: "8092"
      WHALEY_RELAY_MAX_AGE: "${WHALEY_RELAY_MAX_AGE:-2}"
    ports:
      - "${WHALEY_RELAY_PORT:-8092}:8092"
    restart: unless-stopped

  whaley-cli:
    profiles: ["cli"]
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    entrypoint: ["swift", "run", "--skip-build", "whaley"]
    environment:
      WHALEY_RELAY_HOST: whaley-relay
      WHALEY_RELAY_PORT: "8092"
    stdin_open: true
    tty: true
    depends_on: [whaley-relay]

  swift-build:
    profiles: ["build"]
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: ["swift", "build"]

  swift-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: ["swift", "test"]

volumes:
  whaley-db-data:
  scala-sbt-cache:
  scala-coursier-cache:
