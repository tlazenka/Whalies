play.http.secret.key = "local-dev-only-replace-in-production"
play.http.secret.key = ${?PLAY_HTTP_SECRET_KEY}

play.filters.hosts.allowed = ["localhost", "127.0.0.1", "server", "server:9000"]

db.default.driver = "org.postgresql.Driver"
db.default.url = "jdbc:postgresql://localhost:5432/whaley"
db.default.url = ${?WHALEY_JDBC_URL}
db.default.username = "whaley"
db.default.username = ${?WHALEY_DB_USER}
db.default.password = "whaley"
db.default.password = ${?WHALEY_DB_PASSWORD}

play.evolutions.enabled = true
play.evolutions.db.default.enabled = true
play.evolutions.db.default.autoApply = true
play.evolutions.db.default.autoApplyDowns = false

whaley.db.host = "localhost"
whaley.db.host = ${?WHALEY_DB_HOST}
whaley.db.port = 5432
whaley.db.port = ${?WHALEY_DB_PORT}
whaley.db.user = "whaley"
whaley.db.user = ${?WHALEY_DB_USER}
whaley.db.database = "whaley"
whaley.db.database = ${?WHALEY_DB_NAME}
whaley.db.password = "whaley"
whaley.db.password = ${?WHALEY_DB_PASSWORD}
